<svg xmlns="http://www.w3.org/2000/svg"
     width="100px" height="100px" viewBox="30 14 300 300"
     fill="none" role="img"
     aria-labelledby="vipTitle vipDescription"
     style="overflow:visible">
  <title id="vipTitle">AURELUX — VIP Profile Frame</title>
  <desc id="vipDescription">Animated luxury gold profile frame with flowing rainbow light, independent energy arcs, luminous particles, and an integrated VIP badge.</desc>

  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="s1" offset="0%" stop-color="#FFE9A6"/>
      <stop class="s2" offset="16%" stop-color="#FFB84D"/>
      <stop class="s3" offset="32%" stop-color="#FF64B8"/>
      <stop class="s4" offset="48%" stop-color="#9276FF"/>
      <stop class="s5" offset="64%" stop-color="#4DEAFF"/>
      <stop class="s6" offset="80%" stop-color="#A6FFB0"/>
      <stop class="s7" offset="100%" stop-color="#FFE19A"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D5"/>
      <stop offset="15%" stop-color="#D6AC53"/>
      <stop offset="31%" stop-color="#FFF0AE"/>
      <stop offset="47%" stop-color="#A86D24"/>
      <stop offset="65%" stop-color="#FFE49A"/>
      <stop offset="83%" stop-color="#C4933B"/>
      <stop offset="100%" stop-color="#FFF5D5"/>
    </linearGradient>

    <linearGradient id="goldGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0B5" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="56%" stop-color="#FFE9A1"/>
      <stop offset="100%" stop-color="#FFF0B5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="crestMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CD"/>
      <stop offset="14%" stop-color="#E6BE69"/>
      <stop offset="44%" stop-color="#A56F28"/>
      <stop offset="70%" stop-color="#DDB15A"/>
      <stop offset="100%" stop-color="#FFF1BC"/>
    </linearGradient>

    <linearGradient id="crestGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312445"/>
      <stop offset="46%" stop-color="#10101D"/>
      <stop offset="100%" stop-color="#211426"/>
    </linearGradient>

    <radialGradient id="goldAura">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.27"/>
      <stop offset="60%" stop-color="#D9A441" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="prismaticAura">
      <stop offset="0%" stop-color="#8D6AFF" stop-opacity="0.10"/>
      <stop offset="48%" stop-color="#FF64BD" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4DEAFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.3" result="blur"/>
      <feFlood flood-color="#FFCA62" flood-opacity="0.78" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="prismGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softLight" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <pattern id="microTexture" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H4" stroke="#FFE9A6" stroke-width="0.35" stroke-opacity="0.12"/>
      <circle cx="1" cy="2.5" r="0.32" fill="#FFFFFF" fill-opacity="0.16"/>
    </pattern>

    <clipPath id="crestClip">
      <path d="M123 231 Q180 257 237 231 L231 273 Q180 306 129 273Z"/>
    </clipPath>

    <style>
      .s1 { animation: hueGold 8s linear infinite; }
      .s2 { animation: hueGold 8s linear -1.14s infinite; }
      .s3 { animation: hueGold 8s linear -2.28s infinite; }
      .s4 { animation: hueGold 8s linear -3.42s infinite; }
      .s5 { animation: hueGold 8s linear -4.56s infinite; }
      .s6 { animation: hueGold 8s linear -5.70s infinite; }
      .s7 { animation: hueGold 8s linear -6.84s infinite; }

      .ambient { animation: ambientPulse 5.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .outerSpectrum { stroke-dasharray:4 9 36 13 3 17 58 12; animation:spectrumFlow 11s linear infinite; }
      .innerSpectrum { stroke-dasharray:18 7 2 7 31 11 4 13; animation:spectrumFlowReverse 7.6s linear infinite; }
      .energyArcOne { stroke-dasharray:2 8 27 6 3 12; animation:arcFlow 6.4s linear infinite, arcPulse 3.7s ease-in-out infinite; }
      .energyArcTwo { stroke-dasharray:35 12 2 10 8 14; animation:arcFlowReverse 9.2s linear infinite, arcPulse 4.6s ease-in-out -1.7s infinite; }
      .goldArc { stroke-dasharray:36 8 4 8; animation:arcFlow 13s linear infinite; }
      .orbitLight { animation:lightBreath 2.8s ease-in-out infinite; }
      .orbitLightDelayed { animation:lightBreath 3.6s ease-in-out -1.8s infinite; }
      .sparkle { transform-box:fill-box; transform-origin:center; animation:sparkle 2.9s ease-in-out infinite; }
      .sparkleDelayed { transform-box:fill-box; transform-origin:center; animation:sparkle 3.5s ease-in-out -1.7s infinite; }
      .crestGlow { animation:crestBreath 3.8s ease-in-out infinite; }
      .vipShine { stroke-dasharray:4 120; animation:vipShimmer 4.8s ease-in-out infinite; }
      .crestFlare { transform-box:fill-box; transform-origin:center; animation:crestFlare 5.5s ease-in-out infinite; }
      .microDash { stroke-dasharray:1 5; animation:microFlow 4s linear infinite; }

      @keyframes hueGold {
        0% { stop-color:#FFE7A1; } 16% { stop-color:#FFAD54; }
        32% { stop-color:#FF5DB9; } 48% { stop-color:#9670FF; }
        64% { stop-color:#51E5FF; } 80% { stop-color:#B1FFAA; }
        100% { stop-color:#FFE7A1; }
      }
      @keyframes ambientPulse {
        0%,100% { opacity:.44; transform:scale(.985); }
        50% { opacity:.9; transform:scale(1.035); }
      }
      @keyframes spectrumFlow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-420; } }
      @keyframes spectrumFlowReverse { from { stroke-dashoffset:0; } to { stroke-dashoffset:330; } }
      @keyframes arcFlow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-180; } }
      @keyframes arcFlowReverse { from { stroke-dashoffset:0; } to { stroke-dashoffset:210; } }
      @keyframes arcPulse { 0%,100% { opacity:.38; } 48% { opacity:.96; } }
      @keyframes lightBreath { 0%,100% { opacity:.32; } 50% { opacity:1; } }
      @keyframes sparkle {
        0%,100% { opacity:.27; transform:scale(.65) rotate(0deg); }
        50% { opacity:1; transform:scale(1.18) rotate(45deg); }
      }
      @keyframes crestBreath { 0%,100% { opacity:.48; } 50% { opacity:.95; } }
      @keyframes vipShimmer {
        0%,15% { stroke-dashoffset:130; opacity:0; }
        28% { opacity:.75; } 55% { stroke-dashoffset:-30; opacity:.9; }
        72%,100% { stroke-dashoffset:-100; opacity:0; }
      }
      @keyframes crestFlare {
        0%,100% { opacity:.1; transform:scale(.88); }
        45% { opacity:.75; transform:scale(1.06); }
        65% { opacity:.25; transform:scale(1); }
      }
      @keyframes microFlow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-30; } }

      @media (prefers-reduced-motion: reduce) {
        .s1,.s2,.s3,.s4,.s5,.s6,.s7,.ambient,.outerSpectrum,.innerSpectrum,
        .energyArcOne,.energyArcTwo,.goldArc,.orbitLight,.orbitLightDelayed,
        .sparkle,.sparkleDelayed,.crestGlow,.vipShine,.crestFlare,.microDash {
          animation-duration:24s;
        }
      }
    </style>
  </defs>

  <!-- Atmospheric field -->
  <g class="ambient">
    <circle cx="180" cy="144" r="130" fill="url(#goldAura)"/>
    <circle cx="180" cy="144" r="124" fill="url(#prismaticAura)"/>
  </g>

  <circle cx="180" cy="144" r="117" stroke="#E7BD70" stroke-width="0.8" stroke-opacity="0.24"/>
  <circle cx="180" cy="144" r="114.5" stroke="#FBE5A6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="1 5" class="microDash"/>

  <!-- Primary circular frame -->
  <g id="mainFrame">
    <circle cx="180" cy="144" r="109.5" stroke="#F1BB58" stroke-width="8" stroke-opacity="0.18" filter="url(#softLight)"/>
    <circle cx="180" cy="144" r="111" stroke="url(#goldMetal)" stroke-width="2.4"/>
    <circle cx="180" cy="144" r="108.1" stroke="#FFF2C2" stroke-width="0.7" stroke-opacity="0.78"/>

    <circle cx="180" cy="144" r="113.2" stroke="url(#spectrum)" stroke-width="1.8" stroke-linecap="round" class="outerSpectrum" filter="url(#prismGlow)"/>
    <circle cx="180" cy="144" r="104.2" stroke="url(#spectrum)" stroke-width="2.25" stroke-linecap="round" stroke-opacity="0.96" class="innerSpectrum"/>
    <circle cx="180" cy="144" r="100.8" stroke="url(#goldMetal)" stroke-width="4.8" filter="url(#goldGlow)"/>
    <circle cx="180" cy="144" r="96.8" stroke="#FFF2CA" stroke-width="0.9" stroke-opacity="0.66"/>
    <circle cx="180" cy="144" r="94.8" stroke="#DAB36D" stroke-width="0.65" stroke-opacity="0.55"/>

    <!-- Independent spectral arcs -->
    <path d="M102.2 73.6 A102 102 0 0 1 164.4 42.7" stroke="url(#spectrum)" stroke-width="2.1" stroke-linecap="round" class="energyArcOne" filter="url(#prismGlow)"/>
    <path d="M199.2 42.9 A102 102 0 0 1 257.8 72.5" stroke="url(#spectrum)" stroke-width="1.9" stroke-linecap="round" class="energyArcTwo" filter="url(#prismGlow)"/>
    <path d="M264.4 202.5 A102 102 0 0 1 222.2 239.2" stroke="url(#goldMetal)" stroke-width="1.8" stroke-linecap="round" class="goldArc"/>
    <path d="M97.6 201.3 A102 102 0 0 1 85.3 161" stroke="url(#spectrum)" stroke-width="1.9" stroke-linecap="round" class="energyArcTwo"/>

    <!-- Precision-machined graduations -->
    <g stroke="url(#goldMetal)" stroke-linecap="round" stroke-width="1.15">
      <path d="M180 28.8V35.2"/>
      <path d="M167 30.1L168 33.9" stroke-opacity="0.55"/>
      <path d="M193 30.1L192 33.9" stroke-opacity="0.55"/>
      <path d="M80.8 144H87.2"/>
      <path d="M86.3 110.5L91 112.2" stroke-opacity="0.7"/>
      <path d="M86.3 177.5L91 175.8" stroke-opacity="0.7"/>
      <path d="M272.8 144H279.2"/>
      <path d="M273.7 110.5L269 112.2" stroke-opacity="0.7"/>
      <path d="M273.7 177.5L269 175.8" stroke-opacity="0.7"/>
      <path d="M143 41.1L145.1 46.6" stroke-opacity="0.8"/>
      <path d="M217 41.1L214.9 46.6" stroke-opacity="0.8"/>
      <path d="M108.2 75.8L112.9 80.2" stroke-opacity="0.9"/>
      <path d="M251.8 75.8L247.1 80.2" stroke-opacity="0.9"/>
    </g>

    <g filter="url(#goldGlow)">
      <circle cx="180" cy="32.5" r="2.05" fill="url(#goldMetal)"/>
      <circle cx="78" cy="144" r="1.9" fill="url(#goldMetal)"/>
      <circle cx="282" cy="144" r="1.9" fill="url(#goldMetal)"/>
    </g>

    <!-- Moving light particles -->
    <circle r="2.4" fill="#FFFFFF" filter="url(#prismGlow)">
      <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto" path="M 101 76 A 101 101 0 0 1 246 68"/>
      <animate attributeName="opacity" values="0.15;1;0.8;0.15" keyTimes="0;0.3;0.72;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <circle r="1.85" fill="#FFE9A4" filter="url(#goldGlow)">
      <animateMotion dur="5.7s" begin="-2.4s" repeatCount="indefinite" path="M 256 208 A 98 98 0 0 1 115 224"/>
      <animate attributeName="opacity" values="0.1;0.95;0.2" dur="5.7s" repeatCount="indefinite"/>
    </circle>

    <circle r="1.45" fill="#64ECFF" filter="url(#prismGlow)">
      <animateMotion dur="3.6s" begin="-1.1s" repeatCount="indefinite" path="M 180 37 A 106 106 0 0 1 285 144"/>
      <animate attributeName="opacity" values="0;1;0.25;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Star flares -->
    <g class="sparkle" filter="url(#goldGlow)">
      <path d="M107 64 L109 69 L114 71 L109 73 L107 78 L105 73 L100 71 L105 69Z" fill="#FFF0B7"/>
    </g>
    <g class="sparkleDelayed" filter="url(#prismGlow)">
      <path d="M259 91 L260.5 95 L264.5 96.5 L260.5 98 L259 102 L257.5 98 L253.5 96.5 L257.5 95Z" fill="#A5F5FF"/>
    </g>
    <g class="sparkle" filter="url(#goldGlow)" style="animation-delay:-1.2s">
      <path d="M91 187 L92.2 190.3 L95.5 191.5 L92.2 192.7 L91 196 L89.8 192.7 L86.5 191.5 L89.8 190.3Z" fill="#FFE6A0"/>
    </g>

    <circle cx="115" cy="49" r="1.05" fill="#FF85CF" class="orbitLight"/>
    <circle cx="244" cy="51" r="1.2" fill="#85F3FF" class="orbitLightDelayed"/>
    <circle cx="268" cy="186" r="1.05" fill="#D9C1FF" class="orbitLight"/>
    <circle cx="96" cy="220" r="1.15" fill="#FFE6A1" class="orbitLightDelayed"/>

    <path d="M125 47L128 44 M132 43L135 40 M205 39L208 42 M232 51L235 54" stroke="url(#goldMetal)" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.88"/>
    <path d="M74 133L70 133 M74 155L70 155 M286 133L290 133 M286 155L290 155" stroke="url(#goldMetal)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.76"/>
  </g>

  <!-- Integrated VIP crest -->
  <g id="vipCrest">
    <path d="M123 231 Q180 257 237 231 L231 273 Q180 306 129 273Z" stroke="#F8CB74" stroke-width="5" stroke-opacity="0.45" filter="url(#softLight)" class="crestGlow"/>
    <path d="M123 231 Q180 257 237 231 L231 273 Q180 306 129 273Z" fill="url(#crestMetal)" stroke="#FFF0BC" stroke-width="1.15"/>
    <path d="M127.5 235 Q180 258.5 232.5 235 L227.6 270.2 Q180 300.2 132.4 270.2Z" fill="url(#crestGlass)" stroke="#9E7537" stroke-width="0.95"/>

    <rect x="120" y="228" width="120" height="82" fill="url(#microTexture)" clip-path="url(#crestClip)" opacity="0.6"/>
    <path d="M133 242 Q180 262 227 242" stroke="url(#goldMetal)" stroke-width="0.85" stroke-opacity="0.9"/>
    <path d="M137 267 Q180 292 223 267" stroke="#D4A650" stroke-width="0.65" stroke-opacity="0.64"/>

    <path d="M180 245 L185 250 L180 255 L175 250Z" fill="url(#goldMetal)" stroke="#FFF8D7" stroke-width="0.65"/>
    <path d="M180 247 L182.6 250 L180 252.8 L177.4 250Z" fill="url(#spectrum)" filter="url(#prismGlow)"/>
    <path d="M149 251L153 254L149 257 M211 251L207 254L211 257" stroke="url(#goldMetal)" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="256" r="1" fill="#FFF0BC"/>
    <circle cx="220" cy="256" r="1" fill="#FFF0BC"/>

    <text x="180" y="278.8" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="5.2" fill="url(#goldMetal)" stroke="#5A3915" stroke-width="0.35" paint-order="stroke fill">VIP</text>
    <text x="180" y="278.8" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="5.2" fill="none" stroke="url(#goldGlint)" stroke-width="0.85" class="vipShine">VIP</text>

    <path d="M164 288.3 Q180 291.8 196 288.3" stroke="url(#goldMetal)" stroke-width="0.85" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M180 291L182.1 293.1L180 295.2L177.9 293.1Z" fill="url(#goldMetal)" class="crestFlare"/>
    <path d="M132.5 263L134.5 266 M227.5 263L225.5 266" stroke="#FFF0BC" stroke-width="0.85" stroke-linecap="round" stroke-opacity="0.78"/>
  </g>
</svg>