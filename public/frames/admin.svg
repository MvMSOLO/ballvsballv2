<g transform="translate(200 190)" opacity=".9"><g><use href="#spike" transform="rotate(0)"/><use href="#spike" transform="rotate(30)"/><use href="#spike" transform="rotate(60)"/><use href="#spike" transform="rotate(90)"/><use href="#spike" transform="rotate(120)"/><use href="#spike" transform="rotate(150)"/><use href="#spike" transform="rotate(180)"/><use href="#spike" transform="rotate(210)"/><use href="#spike" transform="rotate(240)"/><use href="#spike" transform="rotate(270)"/><use href="#spike" transform="rotate(300)"/><use href="#spike" transform="rotate(330)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="54s" repeatCount="indefinite"/></g></g>
