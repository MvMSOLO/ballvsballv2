<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="ADMIN animated red-black profile frame">
<defs>
 <linearGradient id="lava" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#210006"/><stop offset=".25" stop-color="#ff1236"/><stop offset=".48" stop-color="#ff8547"/><stop offset=".55" stop-color="#fff0e4"/><stop offset=".72" stop-color="#ff193c"/><stop offset="1" stop-color="#170005"/></linearGradient>
 <linearGradient id="obsidian" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a101b"/><stop offset=".45" stop-color="#09080b"/><stop offset="1" stop-color="#000"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#430712"/><stop offset=".5" stop-color="#09070b"/><stop offset="1" stop-color="#000"/></linearGradient>
 <radialGradient id="heat"><stop stop-color="#ff1538" stop-opacity=".5"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></radialGradient>
