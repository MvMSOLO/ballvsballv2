name: BALL ARENA V2 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball-arena-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate route tree and verify app compilation
        run: npm run build:dev

      - name: Type check
        run: npm run typecheck

      - name: Lint full codebase
        run: npm run lint

      - name: Core, economy, controls and match-speed tests
        run: npm run test:arena

      - name: Authentication, navigation and motion policy tests
        run: node --experimental-strip-types --test src/lib/auth/auth-return.test.ts src/lib/auth/auth-capabilities-policy.test.ts src/lib/player-navigation.test.ts src/lib/motion-policy.test.ts

      - name: Validate ball packs
        run: npm run validate-packs

      - name: Production build
        run: npm run build
